# Landing zone request: production subscription for the payments API.
# Reviewed through a pull request; merging it is the approval.
name: payments
environment: prd
location: westeurope
subscription_id: 11111111-1111-1111-1111-111111111111
management_group_id: /providers/Microsoft.Management/managementGroups/contoso-landingzones-corp
owner: team-payments@contoso.com
cost_center: cc-4100
data_classification: confidential

resource_groups:
  - app
  - data

network:
  address_space:
    - 10.110.0.0/22
  subnets:
    app:
      address_prefixes: [10.110.0.0/24]
    data:
      address_prefixes: [10.110.1.0/26]
      private_endpoints: true

role_assignments:
  - principal_id: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa   # Entra group: payments engineers
    role: Reader
    scope: subscription
    description: Engineers read the whole subscription.
  - principal_id: bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb   # Workload identity: payments deploy pipeline
    role: Contributor
    scope: rg:app
    description: Deployment pipeline manages application resources only.

budget:
  amount: 3500
  start_date: "2026-11-01T00:00:00Z"
  contact_emails:
    - team-payments@contoso.com
  thresholds: [50, 80, 100]

tags:
  service-tier: tier-1
