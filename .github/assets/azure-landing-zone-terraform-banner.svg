<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Azure Landing Zone in Terraform</title>
  <desc id="desc">Hub and spoke network with policy guardrails and self-service subscription vending</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#2456c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fb4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Hub and spoke -->
  <g transform="translate(910 150) scale(0.86)">
    <circle r="150" fill="url(#glow)"/>
    <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" fill="none">
      <line x1="0" y1="0" x2="-190" y2="-88"/>
      <line x1="0" y1="0" x2="-170" y2="92"/>
      <line x1="0" y1="0" x2="10" y2="-118"/>
      <line x1="0" y1="0" x2="200" y2="-78"/>
      <line x1="0" y1="0" x2="185" y2="96"/>
      <line x1="0" y1="0" x2="20" y2="122"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 6" fill="none">
      <circle r="78"/>
      <circle r="128"/>
    </g>
    <!-- hub -->
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-width="2.5"/>
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#ffffff" fill-opacity="0.9"/>
    <!-- spokes -->
    <g fill="#0b1f4d" fill-opacity="0.55" stroke="#ffffff" stroke-width="2">
      <rect x="-212" y="-108" width="44" height="40" rx="9"/>
      <rect x="-192" y="72" width="44" height="40" rx="9"/>
      <rect x="-12" y="-140" width="44" height="40" rx="9"/>
      <rect x="178" y="-98" width="44" height="40" rx="9"/>
      <rect x="163" y="76" width="44" height="40" rx="9"/>
      <rect x="-2" y="102" width="44" height="40" rx="9"/>
    </g>
    <g fill="#9cc0ff">
      <circle cx="-190" cy="-88" r="5"/>
      <circle cx="-170" cy="92" r="5"/>
      <circle cx="10" cy="-120" r="5"/>
      <circle cx="200" cy="-78" r="5"/>
      <circle cx="185" cy="96" r="5"/>
      <circle cx="20" cy="122" r="5"/>
    </g>
  </g>

  <!-- Text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="104" font-size="15" font-weight="600" letter-spacing="3" fill-opacity="0.7">TERRAFORM · AZURE · POLICY AS CODE</text>
    <text x="64" y="158" font-size="48" font-weight="700">Azure Landing Zone</text>
    <text x="64" y="202" font-size="22" fill-opacity="0.85">A landing zone from a twenty-line YAML request.</text>
    <text x="64" y="232" font-size="22" fill-opacity="0.85">Private by default, governed from day one.</text>
  </g>
</svg>
